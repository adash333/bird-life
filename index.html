<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffaf0"><title>Bird Life</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#263238;background:#fffaf0}*{box-sizing:border-box}body{margin:0;padding:18px}.app{max-width:560px;margin:auto}.card{background:#fff;border:1px solid #e5e0d8;border-radius:20px;padding:20px;margin-bottom:16px;text-align:center}.top{display:flex;justify-content:space-between;color:#777;font-size:14px}.bird{font-size:82px;margin:12px 0 4px}.name{font-size:22px;font-weight:700}.trait,.msg,.small{color:#666}.msg{margin-top:10px;min-height:24px}.small{font-size:12px}.stat{margin:12px 0;text-align:left}.label{display:flex;justify-content:space-between;font-size:14px}.bar{height:12px;background:#eee;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#78909c}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button,button.primary,.family button{border:1px solid #ddd;background:#fff;border-radius:14px;padding:12px 8px;font-size:15px;cursor:pointer;min-height:54px}button.primary{width:100%;background:#263238;color:#fff;border:0;margin:10px 0 16px}.warm{font-size:18px!important;background:#fff1c7!important;border-color:#e7c86b!important}.family{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:12px}.family button.active{border:2px solid #263238}.family .icon{font-size:32px;display:block}.progress{margin:12px 0 2px}.hidden{display:none}button:disabled{opacity:.45;cursor:not-allowed}
</style></head><body><main class="app">
<section class="card"><div class="top"><span id="count">1羽</span><span>Bird Life</span></div><div id="bird" class="bird">🥚</div><div id="name" class="name"></div><div id="trait" class="trait"></div><div id="stage" class="small"></div><div id="msg" class="msg"></div></section>
<section id="eggPanel" class="card hidden"><strong>🥚 ふかまで</strong><div class="progress"><div class="bar"><div id="warmBar" class="fill"></div></div></div><div id="warmText" class="small"></div><button class="primary warm" id="warm">🤲 あたためる</button><div class="small">3回あたためるとヒナが生まれます。</div></section>
<section class="card" id="stats"></section>
<div class="actions" id="actions"><button id="feed">🍚<br>ごはん</button><button id="play">🧸<br>あそぶ</button><button id="sleep">🌙<br>ねる</button></div>
<button class="primary" id="advance">＋3時間</button>
<section class="card"><strong>🐦 鳥の家族</strong><div class="small">タップすると、その鳥のお世話ができます。</div><div id="family" class="family"></div></section>
</main><script>
const variants=[{adult:"🐦",name:"そら",trait:"青色・ほっぺ模様"},{adult:"🐤",name:"レモン",trait:"黄色・しま模様"},{adult:"🦜",name:"みどり",trait:"緑色・カラフル"},{adult:"🕊️",name:"しろ",trait:"白色・ふわふわ"},{adult:"🐧",name:"くろ",trait:"白黒・おなか模様"}];
const SAVE_KEY="bird-life-save-v2";let nextId=2,selected=1;let flock=[makeBird(1,0)];
function makeBird(id,variant,parent=null){return{id,variant,parent,age:0,warmth:0,food:75,happy:75,energy:75,alive:true,laid:false}}
const el=id=>document.getElementById(id),clamp=v=>Math.max(0,Math.min(100,v)),current=()=>flock.find(b=>b.id===selected);
function stageOf(b){if((b.warmth||0)<3)return["egg","🥚","卵"];if(b.age<18)return["chick","🐣","ヒナ"];if(b.age<36)return["young","🐤","若鳥"];return["adult",variants[b.variant].adult,"成鳥"]}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({nextId,selected,flock}))}catch(e){}}
function load(){try{let raw=localStorage.getItem(SAVE_KEY);if(!raw){raw=localStorage.getItem("bird-life-save-v1")}if(!raw)return false;const d=JSON.parse(raw);if(Array.isArray(d.flock)&&d.flock.length){flock=d.flock.map(b=>({...b,warmth:b.warmth??(b.age>=6?3:0)}));nextId=Number(d.nextId)||Math.max(...flock.map(b=>b.id))+1;selected=flock.some(b=>b.id===d.selected)?d.selected:flock[0].id;return true}}catch(e){}return false}
function render(message){
 const b=current(),v=variants[b.variant],s=stageOf(b),egg=s[0]==="egg";el("bird").textContent=b.alive?s[1]:"🪶";el("name").textContent=egg?"まだ名前のない卵":v.name+"ちゃん";el("trait").textContent=egg?"どんな鳥が生まれるかな？":v.trait;el("stage").textContent=s[2]+(egg?"":"・生後 "+b.age+"時間");el("count").textContent=flock.filter(x=>x.alive).length+"羽";
 el("eggPanel").classList.toggle("hidden",!egg||!b.alive);el("stats").classList.toggle("hidden",egg);el("actions").classList.toggle("hidden",egg);el("advance").classList.toggle("hidden",egg);
 if(egg){const w=b.warmth||0;el("warmBar").style.width=(w/3*100)+"%";el("warmText").textContent=w+" / 3 回 あたためました";}else{el("stats").innerHTML=[["food","🍚 おなか"],["happy","❤️ ごきげん"],["energy","⚡ げんき"]].map(([k,l])=>'<div class="stat"><div class="label"><span>'+l+'</span><span>'+Math.round(b[k])+'</span></div><div class="bar"><div class="fill" style="width:'+b[k]+'%"></div></div></div>').join("")}
 if(message)el("msg").textContent=message;else el("msg").textContent=!b.alive?"この鳥は思い出として家族に残っています。":egg?"やさしくあたためてあげましょう。":s[0]==="adult"&&!b.laid?"元気な成鳥です。よい状態を保つと卵を産みます。":"元気に育っています。";
 document.querySelectorAll("#actions button").forEach(x=>x.disabled=!b.alive);el("advance").disabled=!b.alive;renderFamily();save();
}
function renderFamily(){el("family").innerHTML="";for(const b of flock){const s=stageOf(b),v=variants[b.variant],btn=document.createElement("button");btn.className=b.id===selected?"active":"";btn.innerHTML='<span class="icon">'+(b.alive?s[1]:"🪶")+'</span>'+(s[0]==="egg"?"卵":v.name)+'<br><span class="small">'+s[2]+"</span>";btn.onclick=()=>{selected=b.id;render()};el("family").appendChild(btn)}}
function change(vals,msg){const b=current();if(!b.alive||stageOf(b)[0]==="egg")return;Object.entries(vals).forEach(([k,v])=>b[k]=clamp(b[k]+v));checkLife(b);render(msg)}
function checkLife(b){if(b.food<=0||b.happy<=0||b.energy<=0)b.alive=false}
function chooseChildVariant(parent){if(Math.random()<.55)return parent.variant;let n;do{n=Math.floor(Math.random()*variants.length)}while(n===parent.variant);return n}
function layEgg(parent){parent.laid=true;const child=makeBird(nextId++,chooseChildVariant(parent),parent.id);flock.push(child);return child}
el("warm").onclick=()=>{const b=current();if(!b.alive||stageOf(b)[0]!=="egg")return;b.warmth=(b.warmth||0)+1;if(b.warmth>=3){b.warmth=3;b.age=6;render("🐣 たまごがかえりました！ "+variants[b.variant].name+"ちゃんの誕生です！")}else render("🤲 卵をあたためました。あと "+(3-b.warmth)+" 回です。")};
el("feed").onclick=()=>change({food:25,happy:3},"ごはんを食べました！");el("play").onclick=()=>change({happy:24,energy:-10,food:-6},"いっぱい遊びました！");el("sleep").onclick=()=>change({energy:30,food:-8},"ぐっすり眠りました。");
el("advance").onclick=()=>{const b=current();if(!b.alive||stageOf(b)[0]==="egg")return;b.age+=3;b.food=clamp(b.food-10);b.happy=clamp(b.happy-6);b.energy=clamp(b.energy-7);checkLife(b);let msg="3時間たちました。";if(b.alive&&stageOf(b)[0]==="adult"&&!b.laid&&b.food>=55&&b.happy>=55&&b.energy>=55){const child=layEgg(b);msg="🥚 "+variants[b.variant].name+"ちゃんが卵を産みました！ 卵をあたためてみましょう。";selected=child.id}render(msg)};
const restored=load();render(restored?"おかえりなさい。前回の続きから育てられます。":"最初の卵がやってきました。あたためてみましょう！");
</script></body></html>
