<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#bfe7ff"><title>Bird Life</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#263238;background:#eef8ff}.app{max-width:760px;margin:auto;padding:12px}.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}.soundStart{border:0;border-radius:999px;padding:10px 14px;background:#263238;color:white;font-size:14px}.world{position:relative;height:390px;overflow:hidden;border-radius:22px;border:2px solid #b7d7a8;background:linear-gradient(#bfe7ff 0 54%,#8fd36d 54% 100%);box-shadow:0 3px 12px #0001}.sun{position:absolute;right:28px;top:24px;font-size:52px}.cloud{position:absolute;font-size:42px;opacity:.9}.c1{left:12%;top:28px}.c2{left:53%;top:70px}.tree{position:absolute;font-size:76px;bottom:56px}.t1{left:4%}.t2{right:4%}.pond{position:absolute;right:20%;bottom:24px;width:120px;height:36px;border-radius:50%;background:#70c9e8;border:3px solid #61b4d0}.flowers{position:absolute;left:15%;bottom:18px;font-size:25px}.nest{position:absolute;left:43%;bottom:54px;font-size:42px}.worldBird{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);transition:left 1.8s ease-in-out,top .7s ease-in-out;filter:drop-shadow(0 3px 2px #0002);cursor:pointer;user-select:none}.worldBird.selected{filter:drop-shadow(0 0 7px #fff) drop-shadow(0 3px 2px #0003)}.worldBird.walking{animation:bob .38s infinite alternate}@keyframes bob{to{transform:translate(-50%,-58%) rotate(3deg)}}.panel{background:white;border:1px solid #dfe8e0;border-radius:18px;padding:16px;margin-top:12px;text-align:center}.name{font-size:21px;font-weight:800}.muted{color:#667;font-size:13px}.msg{min-height:24px;margin:8px 0}.stats{margin:12px 0}.stat{margin:11px 0;text-align:left}.statLabel{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}.statBar{height:13px;background:#e9eeea;border-radius:99px;overflow:hidden}.statFill{height:100%;background:#78909c;border-radius:99px;transition:width .3s ease}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button,.primary{min-height:50px;border:1px solid #d8ded8;border-radius:13px;background:white;font-size:15px}.primary{width:100%;margin-top:8px;background:#263238;color:white;border:0}.warm{background:#fff1c7;color:#263238}.family{display:flex;gap:7px;overflow-x:auto;padding:8px 0}.family button{min-width:76px;border:1px solid #ddd;background:#fff;border-radius:12px;padding:8px}.family button.active{border:2px solid #263238}.hidden{display:none}@media(max-width:480px){.world{height:340px}.worldBird{width:58px;height:58px}.tree{font-size:62px}.stats{gap:5px}.app{padding:8px}}
</style></head><body><main class="app"><div class="hud"><span>🌎 Bird Life World · <span id="count">1羽</span></span><button id="soundStart" class="soundStart">🔊 音をはじめる</button></div>
<section id="world" class="world" aria-label="鳥たちが暮らす世界"><div class="sun">☀️</div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="tree t1">🌳</div><div class="tree t2">🌲</div><div class="pond"></div><div class="flowers">🌼 🌷 🌼</div><div class="nest">🪹</div></section>
<section class="panel"><div id="name" class="name"></div><div id="trait" class="muted"></div><div id="stage" class="muted"></div><div id="msg" class="msg"></div>
<div id="eggPanel" class="hidden"><div class="muted" id="warmText"></div><button id="warm" class="primary warm">🤲 あたためる</button></div>
<div id="stats" class="stats"></div><div id="actions" class="actions"><button id="feed">🍚<br>ごはん</button><button id="play">🧸<br>あそぶ</button><button id="sleep">🌙<br>ねる</button></div><button id="advance" class="primary">⏩ ＋3時間</button></section>
<section class="panel"><strong>🐦 鳥の家族</strong><div id="family" class="family"></div></section></main><script>
const variants=[{adult:"🐦",type:"青い鳥",trait:"青色・ほっぺ模様"},{adult:"🐤",type:"黄色い鳥",trait:"黄色・しま模様"},{adult:"🦜",type:"緑の鳥",trait:"緑色・カラフル"},{adult:"🕊️",type:"白い鳥",trait:"白色・ふわふわ"},{adult:"🐧",type:"白黒の鳥",trait:"白黒・おなか模様"}],SAVE_KEY="bird-life-save-v2";
const COLORS=["#55aee6","#ffd34e","#75c96b","#f38aaa","#a98ce3","#f39b4a","#64c9c1","#e86f6f","#8c6b4f","#f4f1e8"];
const BELLY=["#fff4cf","#ffffff","#dff6ff","#ffe0ec","#e7ffd9","#f5ddff"];
const PATTERNS=["none","stripes","spots","cheeks","bib"];
function genesFor(id,parent=null){const p=parent&&parent.genes;if(p&&Math.random()<.65)return{body:Math.random()<.7?p.body:COLORS[id%COLORS.length],belly:Math.random()<.7?p.belly:BELLY[id%BELLY.length],pattern:Math.random()<.65?p.pattern:PATTERNS[id%PATTERNS.length],accent:COLORS[(id+3)%COLORS.length]};return{body:COLORS[(id*3)%COLORS.length],belly:BELLY[(id*2)%BELLY.length],pattern:PATTERNS[id%PATTERNS.length],accent:COLORS[(id*5+2)%COLORS.length]}}
function birdSvg(b,small=false){const s=stageOf(b);if(s[0]==="egg")return '<span style="font-size:'+(small?30:48)+'px">🥚</span>';const g=b.genes||genesFor(b.id);let pattern="";if(g.pattern==="stripes")pattern='<path d="M20 28 Q32 34 44 28 M18 35 Q32 41 46 35" fill="none" stroke="'+g.accent+'" stroke-width="4" stroke-linecap="round"/>';if(g.pattern==="spots")pattern='<circle cx="23" cy="31" r="4" fill="'+g.accent+'"/><circle cx="39" cy="37" r="3.5" fill="'+g.accent+'"/><circle cx="34" cy="24" r="3" fill="'+g.accent+'"/>';if(g.pattern==="cheeks")pattern='<circle cx="18" cy="23" r="4" fill="#f48b8b"/><circle cx="46" cy="23" r="4" fill="#f48b8b"/>';if(g.pattern==="bib")pattern='<ellipse cx="32" cy="38" rx="12" ry="13" fill="'+g.belly+'"/>';return '<svg viewBox="0 0 64 64" width="100%" height="100%" aria-hidden="true"><ellipse cx="32" cy="35" rx="22" ry="24" fill="'+g.body+'" stroke="#4c5960" stroke-width="2"/><ellipse cx="32" cy="42" rx="13" ry="15" fill="'+g.belly+'"/>'+pattern+'<circle cx="24" cy="20" r="3" fill="#222"/><circle cx="40" cy="20" r="3" fill="#222"/><path d="M29 25 L35 25 L32 30 Z" fill="#ef9b35"/><path d="M12 34 Q4 39 13 44" fill="'+g.accent+'" stroke="#4c5960" stroke-width="2"/><path d="M52 34 Q60 39 51 44" fill="'+g.accent+'" stroke="#4c5960" stroke-width="2"/><path d="M25 58 l-3 4 M39 58 l3 4" stroke="#9a6b38" stroke-width="2"/></svg>'}
const NAMES=["そら","レモン","ミント","モモ","ルル","ココ","ピノ","ハナ","チロ","ポポ","リン","ナナ","キキ","マロン","ユズ","ラテ","ノア","ベル","ミミ","フク","サクラ","ツキ","ホシ","ニコ","クルミ","アオ","シロップ","ラムネ","プラム","メイ"];
function uniqueName(id){const used=new Set(flock?.filter(b=>b.id!==id).map(b=>b.name).filter(Boolean)||[]);for(let i=0;i<NAMES.length;i++){const n=NAMES[(id-1+i)%NAMES.length];if(!used.has(n))return n}return "とり"+id}
let nextId=2,selected=1,flock=[makeBird(1,0)],audioCtx=null,soundReady=false,moveTimer=null,actionCount=0;
function makeBird(id,variant,parent=null){const p=typeof flock!=="undefined"?flock.find(x=>x.id===parent):null;return{id,variant,parent,name:null,genes:genesFor(id,p),age:0,warmth:0,food:75,happy:75,energy:75,alive:true,laid:false,x:25+Math.random()*50,y:72+Math.random()*12}}
const el=id=>document.getElementById(id),clamp=v=>Math.max(0,Math.min(100,v)),current=()=>flock.find(b=>b.id===selected);
function stageOf(b){if((b.warmth||0)<3)return["egg","🥚","卵"];if(b.age<18)return["chick","🐣","ヒナ"];if(b.age<36)return["young","🐤","若鳥"];return["adult",variants[b.variant].adult,"成鳥"]}
async function startAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();soundReady=audioCtx.state==="running";el("soundStart").textContent=soundReady?"🔊 音 ON":"🔇 音を再試行";if(soundReady)sound("chirp")}catch(e){el("soundStart").textContent="🔇 このブラウザでは音声不可"}}
function tone(f,d=.08,type="sine",v=.12,delay=0){if(!soundReady||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+d)}
function noise(d=.06,v=.09,delay=0){if(!soundReady||!audioCtx)return;const n=Math.floor(audioCtx.sampleRate*d),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(audioCtx.destination);s.start(audioCtx.currentTime+delay)}
function sound(k){if(k==="chirp"){tone(1300,.09,"sine",.14);tone(1850,.1,"sine",.12,.1);tone(1550,.08,"sine",.1,.21)}if(k==="eat"){noise(.06,.13);noise(.05,.12,.09);noise(.06,.12,.18);tone(480,.07,"triangle",.08,.26)}if(k==="walk"){tone(150,.05,"sine",.1);tone(210,.05,"sine",.09,.12)}if(k==="hatch"){noise(.14,.12);tone(700,.12,"triangle",.12,.1);tone(1200,.15,"sine",.14,.25)}if(k==="egg"){tone(600,.12,"sine",.1);tone(950,.15,"sine",.12,.14)}if(k==="sleep"){tone(300,.18,"sine",.07);tone(230,.22,"sine",.06,.18)}if(k==="warm"){tone(500,.1,"sine",.08);tone(700,.1,"sine",.07,.1)}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({nextId,selected,flock}))}catch(e){}}
function load(){try{let raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem("bird-life-save-v1");if(!raw)return false;const d=JSON.parse(raw);if(d.flock?.length){flock=d.flock.map(b=>({...b,warmth:b.warmth??(b.age>=6?3:0),x:b.x??25+Math.random()*50,y:b.y??72+Math.random()*12}));for(const b of flock){if(!b.name)b.name=uniqueName(b.id);if(!b.genes)b.genes=genesFor(b.id,flock.find(x=>x.id===b.parent))}nextId=+d.nextId||Math.max(...flock.map(b=>b.id))+1;selected=flock.some(b=>b.id===d.selected)?d.selected:flock[0].id;return true}}catch(e){}return false}
function renderWorld(){document.querySelectorAll(".worldBird").forEach(n=>n.remove());for(const b of flock.filter(x=>x.alive)){const s=stageOf(b),n=document.createElement("div");n.className="worldBird"+(b.id===selected?" selected":"");n.dataset.id=b.id;n.innerHTML=birdSvg(b);n.style.left=b.x+"%";n.style.top=b.y+"%";n.onclick=()=>{selected=b.id;sound("chirp");render()};el("world").appendChild(n)}}
function render(message){const b=current(),v=variants[b.variant],s=stageOf(b),egg=s[0]==="egg";el("count").textContent=flock.filter(x=>x.alive).length+"羽";if(!b.name&&!egg)b.name=uniqueName(b.id);el("name").textContent=egg?"まだ名前のない卵":b.name+"ちゃん";el("trait").textContent=egg?"どんな鳥が生まれるかな？":"模様："+({none:"無地",stripes:"しま模様",spots:"水玉模様",cheeks:"ほっぺ模様",bib:"おなか模様"}[b.genes?.pattern]||"無地");el("stage").textContent=s[2]+(egg?"":"・生後 "+b.age+"時間");el("msg").textContent=message||(!b.alive?"この鳥は思い出として残っています。":egg?"世界の中の卵をあたためましょう。":s[0]==="adult"&&!b.laid?"元気に育てると卵を産みます。":"世界の中を自由に歩いています。");el("eggPanel").classList.toggle("hidden",!egg||!b.alive);el("stats").classList.toggle("hidden",egg);el("actions").classList.toggle("hidden",egg);el("advance").classList.toggle("hidden",egg);if(egg)el("warmText").textContent=(b.warmth||0)+" / 3 回 あたためました";else el("stats").innerHTML=[["food","🍚 おなか"],["happy","❤️ ごきげん"],["energy","⚡ げんき"]].map(([k,l])=>'<div class="stat"><div class="statLabel"><span>'+l+'</span><strong>'+Math.round(b[k])+'</strong></div><div class="statBar"><div class="statFill" style="width:'+clamp(b[k])+'%"></div></div></div>').join("");renderWorld();renderFamily();save()}
function renderFamily(){el("family").innerHTML="";for(const b of flock){const s=stageOf(b),v=variants[b.variant],btn=document.createElement("button");btn.className=b.id===selected?"active":"";btn.innerHTML=(b.alive?birdSvg(b,true):"🪶")+"<br>"+(s[0]==="egg"?"卵":(b.name||uniqueName(b.id)));btn.onclick=()=>{selected=b.id;render()};el("family").appendChild(btn)}}
function passTime(b){if(!b||!b.alive||stageOf(b)[0]==="egg")return null;b.age+=3;b.food=clamp(b.food-10);b.happy=clamp(b.happy-6);b.energy=clamp(b.energy-7);if(b.food<=0||b.happy<=0||b.energy<=0)b.alive=false;if(b.alive&&stageOf(b)[0]==="adult"&&!b.laid&&b.food>=55&&b.happy>=55&&b.energy>=55){const child=layEgg(b);sound("egg");selected=child.id;return " 🥚 そして卵を産みました！"}return " ⏰ お世話をしているうちに3時間たちました。"}
function countAction(msg){actionCount++;if(actionCount>=3){actionCount=0;const extra=passTime(current());return msg+(extra||"")}return msg+"（あと"+(3-actionCount)+"回のお世話で時間が進みます）"}
function change(vals,msg){const b=current();if(!b.alive||stageOf(b)[0]==="egg")return;Object.entries(vals).forEach(([k,v])=>b[k]=clamp(b[k]+v));if(b.food<=0||b.happy<=0||b.energy<=0)b.alive=false;render(countAction(msg))}
function chooseChildVariant(p){if(Math.random()<.55)return p.variant;let n;do{n=Math.floor(Math.random()*variants.length)}while(n===p.variant);return n}
function layEgg(p){p.laid=true;const c=makeBird(nextId++,chooseChildVariant(p),p.id);c.name=uniqueName(c.id);c.x=p.x+Math.random()*8-4;c.y=p.y;flock.push(c);return c}
function wander(){for(const b of flock.filter(x=>x.alive&&stageOf(x)[0]!=="egg")){b.x=clamp((b.x||50)+(Math.random()*28-14));b.x=Math.max(12,Math.min(88,b.x));b.y=Math.max(63,Math.min(86,(b.y||75)+(Math.random()*10-5)));const n=document.querySelector('.worldBird[data-id="'+b.id+'"]');if(n){n.classList.add("walking");n.style.left=b.x+"%";n.style.top=b.y+"%";setTimeout(()=>n.classList.remove("walking"),1500)}}save()}
el("soundStart").onclick=startAudio;el("warm").onclick=()=>{const b=current();if(stageOf(b)[0]!=="egg")return;b.warmth=(b.warmth||0)+1;if(b.warmth>=3){b.warmth=3;b.age=6;if(!b.name)b.name=uniqueName(b.id);sound("hatch");render("🐣 たまごがかえりました！ "+b.name+"ちゃんが世界に出てきました！")}else{sound("warm");render("🤲 卵をあたためました。あと "+(3-b.warmth)+" 回です。")}};
el("feed").onclick=()=>{sound("eat");change({food:25,happy:3},"🍚 おいしそうに食べています。")};el("play").onclick=()=>{sound("chirp");change({happy:24,energy:-10,food:-6},"🧸 楽しそうに遊んでいます！")};el("sleep").onclick=()=>{sound("sleep");change({energy:30,food:-8},"💤 すやすや眠っています。")};
el("advance").onclick=()=>{const b=current();if(stageOf(b)[0]==="egg")return;sound("walk");actionCount=0;render("⏩ "+(passTime(b)||"3時間たちました。"))};
const restored=load();if(!restored){flock[0].name=uniqueName(flock[0].id)}render(restored?"おかえりなさい。鳥たちは世界で暮らしています。":"最初の卵が世界にやってきました。");moveTimer=setInterval(wander,2600);
</script></body></html>
