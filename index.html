<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bird Life</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#263238;background:#fffaf0}body{margin:0;padding:20px}.app{max-width:560px;margin:auto}.card{background:#fff;border:1px solid #e5e0d8;border-radius:20px;padding:20px;margin-bottom:16px;text-align:center}.top{display:flex;justify-content:space-between;color:#777;font-size:14px}.bird{font-size:80px;margin:14px 0 6px}.name{font-size:22px;font-weight:700}.trait,.msg,.small{color:#666}.msg{margin-top:10px}.small{font-size:12px}.stat{margin:12px 0;text-align:left}.label{display:flex;justify-content:space-between;font-size:14px}.bar{height:12px;background:#eee;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#78909c}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button,button.primary,.family button{border:1px solid #ddd;background:#fff;border-radius:14px;padding:12px 8px;font-size:15px;cursor:pointer;min-height:52px}button.primary{width:100%;background:#263238;color:#fff;border:0;margin:10px 0 16px}.family{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:12px}.family button.active{border:2px solid #263238}.family .icon{font-size:32px;display:block}.eggbox{margin-top:12px;padding:12px;border-radius:14px;background:#fff8dc}.hidden{display:none}
</style></head>
<body><main class="app">
<section class="card"><div class="top"><span id="count">1羽</span><span>Bird Life</span></div><div id="bird" class="bird">🥚</div><div id="name" class="name"></div><div id="trait" class="trait"></div><div id="stage" class="small"></div><div id="msg" class="msg"></div></section>
<section class="card" id="stats"></section>
<div class="actions"><button id="feed">🍚<br>ごはん</button><button id="play">🧸<br>あそぶ</button><button id="sleep">🌙<br>ねる</button></div>
<button class="primary" id="advance">＋3時間</button>
<section class="card"><strong>🐦 鳥の家族</strong><div class="small">鳥をタップすると、その鳥のお世話ができます。</div><div id="family" class="family"></div></section>
</main>
<script>
const variants=[
 {adult:"🐦",name:"そら",trait:"青色・ほっぺ模様"},
 {adult:"🐤",name:"レモン",trait:"黄色・しま模様"},
 {adult:"🦜",name:"みどり",trait:"緑色・カラフル"},
 {adult:"🕊️",name:"しろ",trait:"白色・ふわふわ"},
 {adult:"🐧",name:"くろ",trait:"白黒・おなか模様"}
];
let nextId=2,selected=1;
const flock=[makeBird(1,0)];
function makeBird(id,variant,parent=null){return{id,variant,parent,age:0,food:75,happy:75,energy:75,alive:true,laid:false}}
const el=id=>document.getElementById(id),clamp=v=>Math.max(0,Math.min(100,v)),current=()=>flock.find(b=>b.id===selected);
function stageOf(b){if(b.age<6)return["egg","🥚","卵"];if(b.age<18)return["chick","🐣","ヒナ"];if(b.age<36)return["young","🐤","若鳥"];return["adult",variants[b.variant].adult,"成鳥"]}
function render(message){
 const b=current(),v=variants[b.variant],s=stageOf(b);el("bird").textContent=b.alive?s[1]:"🪶";el("name").textContent=v.name+"ちゃん";el("trait").textContent=v.trait;el("stage").textContent=s[2]+"・生後 "+b.age+"時間";el("count").textContent=flock.filter(x=>x.alive).length+"羽";
 el("stats").innerHTML=[["food","🍚 おなか"],["happy","❤️ ごきげん"],["energy","⚡ げんき"]].map(([k,l])=>'<div class="stat"><div class="label"><span>'+l+'</span><span>'+Math.round(b[k])+'</span></div><div class="bar"><div class="fill" style="width:'+b[k]+'%"></div></div></div>').join("");
 if(message)el("msg").textContent=message;else el("msg").textContent=!b.alive?"この鳥は思い出として家族に残っています。":s[0]==="egg"?"卵をあたためて育てましょう。":s[0]==="adult"&&!b.laid?"元気に育つと卵を産みます。":"元気に育っています。";
 document.querySelectorAll(".actions button").forEach(x=>x.disabled=!b.alive);el("advance").disabled=!b.alive;renderFamily();
}
function renderFamily(){el("family").innerHTML="";for(const b of flock){const s=stageOf(b),v=variants[b.variant],btn=document.createElement("button");btn.className=b.id===selected?"active":"";btn.innerHTML='<span class="icon">'+(b.alive?s[1]:"🪶")+'</span>'+v.name+'<br><span class="small">'+s[2]+"</span>";btn.onclick=()=>{selected=b.id;render()};el("family").appendChild(btn)}}
function change(vals,msg){const b=current();if(!b.alive)return;Object.entries(vals).forEach(([k,v])=>b[k]=clamp(b[k]+v));checkLife(b);render(msg)}
function checkLife(b){if(b.food<=0||b.happy<=0||b.energy<=0)b.alive=false}
function chooseChildVariant(parent){if(Math.random()<.55)return parent.variant;let n;do{n=Math.floor(Math.random()*variants.length)}while(n===parent.variant);return n}
function layEgg(parent){parent.laid=true;const child=makeBird(nextId++,chooseChildVariant(parent),parent.id);flock.push(child);return child}
el("feed").onclick=()=>change({food:25,happy:3},"ごはんを食べました！");
el("play").onclick=()=>change({happy:24,energy:-10,food:-6},"いっぱい遊びました！");
el("sleep").onclick=()=>change({energy:30,food:-8},"ぐっすり眠りました。");
el("advance").onclick=()=>{const b=current();if(!b.alive)return;b.age+=3;b.food=clamp(b.food-10);b.happy=clamp(b.happy-6);b.energy=clamp(b.energy-7);checkLife(b);let msg="3時間たちました。";if(b.alive&&stageOf(b)[0]==="adult"&&!b.laid&&b.food>=55&&b.happy>=55&&b.energy>=55){const child=layEgg(b);msg="🥚 "+variants[b.variant].name+"ちゃんが卵を産みました！ 新しい家族が増えました。";selected=child.id}render(msg)};
render("最初の卵がやってきました。育ててみましょう！");
</script></body></html>
