<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#bfe7ff" />
    <title>Bird Life</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <div class="hud">
        <span>🌎 Bird Life World · <span id="count">1羽</span></span
        ><button id="soundStart" class="soundStart">🔊 音をON</button>
      </div>
      <section id="world" class="world" aria-label="鳥たちが暮らす世界">
        <div class="sun">☀️</div>
        <div class="cloud c1">☁️</div>
        <div class="cloud c2">☁️</div>
        <div id="field" class="field">
          <div class="tree t1">🌳</div>
          <div class="tree t2">🌲</div>
          <div class="pond"></div>
          <div class="flowers">🌼 🌷 🌼</div>
          <div class="nest">🪹</div>
        </div>
      </section>
      <section class="panel care">
        <div id="bootStatus" class="muted">ゲームを読み込み中…</div>
        <div id="name" class="name"></div>
        <div id="trait" class="muted"></div>
        <div id="stage" class="muted"></div>
        <div id="msg" class="msg"></div>
        <div id="eggPanel" class="hidden">
          <div class="muted" id="warmText"></div>
          <button id="warm" class="primary warm">🤲 あたためる</button>
        </div>
        <div id="revivePanel" class="hidden">
          <div class="muted" id="reviveText"></div>
          <button id="revive" class="primary warm">🤲 なでて起こす</button>
        </div>
        <div id="stats" class="stats"></div>
        <div id="actions" class="actions">
          <button id="feed">🍚<br />ごはん</button><button id="play">🧸<br />あそぶ</button
          ><button id="sleep">🌙<br />ねる</button
          ><button id="advance" class="primary">⏩<br />＋3時間</button>
        </div>
        <div class="dataActions">
          <button id="exportData">JSONエクスポート</button>
          <button id="importData">JSONインポート</button>
          <input id="importFile" type="file" accept=".json,application/json" hidden />
        </div>
        <p class="dataHint">インポートすると現在のゲームデータを置き換えます。</p>
        <div id="dataStatus" class="muted" role="status" aria-live="polite"></div>
      </section>
      <section class="panel familyPanel">
        <strong>🐦 鳥の家族</strong>
        <div id="family" class="family"></div>
      </section>
      <aside id="hungerNotice" class="hungerNotice hidden">
        <button id="closeNotice" aria-label="閉じる">×</button><strong>🍚 おなかがすいたよ！</strong>
        <div id="noticeText"></div>
      </aside>
    </main>
    <script>
      // どこかのファイルでエラーが起きたら、画面にファイル名と行番号を出す（修正しやすくするため）
      window.addEventListener("error", function (e) {
        var box = document.getElementById("bootStatus");
        if (!box) return;
        var where = e.filename ? "（" + e.filename.split("/").pop() + " " + e.lineno + "行目）" : "";
        var detail =
          e.message === "Script error."
            ? "詳しくはブラウザの開発者ツールのコンソールを見てください"
            : e.message;
        box.textContent = "⚠️ エラー: " + detail + where;
      });
    </script>
    <script src="js/state.js"></script>
    <script src="js/birds.js"></script>
    <script src="js/birdArt.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/save.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
